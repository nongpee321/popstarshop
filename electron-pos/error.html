<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopCentral POS — การตั้งค่าการเชื่อมต่อ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; max-width: 520px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; }
        .icon { width: 64px; height: 64px; background: rgba(239, 68, 68, 0.15); color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 20px; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
        input { width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 12px 14px; font-size: 14px; color: #fff; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #3b82f6; }
        .hint { font-size: 12px; color: #64748b; margin-top: 6px; }
        .btn-group { display: flex; gap: 12px; }
        button { flex: 1; padding: 12px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #334155; color: #cbd5e1; }
        .btn-secondary:hover { background: #475569; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚠️</div>
        <h1>ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ POS ได้</h1>
        <p>โปรดตรวจสอบว่าเปิดเซิร์ฟเวอร์ ERP อยู่ หรือตั้งค่า IP/URL ให้ตรงกับเครื่องหลัก</p>
        
        <div class="form-group">
            <label for="serverUrl">ที่อยู่เซิร์ฟเวอร์ POS (URL หรือ IP):</label>
            <input type="text" id="serverUrl" placeholder="เช่น http://192.168.100.78:8000/pos หรือ http://localhost:8000/pos">
            <div class="hint">ค่านี้จะถูกบันทึกลงในไฟล์ <code>config.txt</code> อัตโนมัติ</div>
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="retry()">ลองเชื่อมต่อใหม่</button>
            <button class="btn-primary" onclick="saveAndConnect()">บันทึกและเชื่อมต่อ</button>
        </div>
    </div>

    <script>
        async function init() {
            if (window.posApp) {
                const currentUrl = await window.posApp.getConfigUrl();
                document.getElementById('serverUrl').value = currentUrl || '';
            } else {
                const params = new URLSearchParams(window.location.search);
                document.getElementById('serverUrl').value = params.get('currentUrl') || 'http://127.0.0.1:8000/pos';
            }
        }

        async function saveAndConnect() {
            const val = document.getElementById('serverUrl').value.trim();
            if (!val) {
                alert('กรุณากรอก URL เซิร์ฟเวอร์');
                return;
            }
            if (window.posApp) {
                await window.posApp.saveConfigUrl(val);
            } else {
                window.location.href = val;
            }
        }

        async function retry() {
            if (window.posApp) {
                await window.posApp.retryConnection();
            } else {
                window.location.reload();
            }
        }

        init();
    </script>
</body>
</html>
