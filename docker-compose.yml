name: popfood

services:
  db:
    image: postgres:15
    container_name: popfood_erp_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pop_erp}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - erppop-main_db-data:/var/lib/postgresql/data
    networks:
      - popfood_erp_network

  app:
    image: erppop-main-app
    container_name: popfood_erp_app
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - popfood_erp_network
    depends_on:
      - db
    environment:
      PHP_CLI_SERVER_WORKERS: 8
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload

  adminer:
    image: adminer
    container_name: popfood_erp_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - popfood_erp_network

volumes:
  erppop-main_db-data:
    external: true

networks:
  popfood_erp_network:
    driver: bridge
